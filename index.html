<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGS</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <h1>Found a dog Breed </h1>

<form class="form" aria-labelledby="form-title">
	<label for="breedName">Breed name:</label>
    <input type="text" name="breedName" id="breedName">
    <label for="Temperament">Temperament:</label>
	<select id="Temperament" name="Temperament">
		<option value="">--Select Temperament--</option>
		<option value="hardcover-playful">Playful</option>
		<option value="hardcover-friendly">Friendly</option>
        <option value="hardcover-energetic">Energetic</option>
        <option value="hardcover-loyal">Loyal</option>
        <option value="hardcover-protective">Protective</option>
        <option value="hardcover-intelligent">Intelligent</option>
        <option value="hardcover-affectionate">Affectionate</option>
	</select>

	<button type="submit" class="submit">Search</button>
</form>

<div id="dogs"></div>
<p class="message"></p>

<script src="js/dogs.js"></script>
</body>
</html>
